name: Build and Sign Official Release (v4)
on:
  push:
    branches:
      - main  # أو اسم الفرع الأساسي عندك (master/main)
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً أيضاً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Build Web Project (Vite/React/Vue)
        run: |
          # تأكد أن هذا الأمر هو المستخدم في الـ package.json عندك
          npm run build

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Fix Gradle Path Check
        run: echo "android.overridePathCheck=true" >> android/gradle.properties

      - name: Decrypt Keystore
        run: |
          # تحويل الكود النصي من Secrets إلى ملف حقيقي
          echo "${{ secrets.ANDROID_KEYSTORE_CONTENT }}" | base64 -d > release.keystore

      - name: Build and Sign Release (APK & AAB)
        run: |
          cd android
          chmod +x gradlew
          # بناء نسخة الـ Release وحقن المفاتيح مباشرة في عملية البناء
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-Laila-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed AAB (For Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-Laila-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab