name: Build Official Signed APK and AAB
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Fix Vite Permissions
        run: chmod +x node_modules/.bin/vite

      - name: Build web project
        run: npm run build
        
      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Prepare Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_CONTENT }}" | base64 -d > release.keystore

      - name: Build Signed Release (APK and AAB)
        run: |
          cd android
          chmod +x gradlew
          # أولاً: بناء الـ APK للتجربة الشخصية
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
          
          # ثانياً: بناء الـ AAB للرفع الرسمي لجوجل
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare Final Files
        run: |
          mkdir -p final-outputs
          mv android/app/build/outputs/apk/release/app-release.apk "final-outputs/Mushaf_Test_v4.apk"
          mv android/app/build/outputs/bundle/release/app-release.aab "final-outputs/Mushaf_Official_v4.aab"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Mushaf-Final-Files
          path: final-outputs/*