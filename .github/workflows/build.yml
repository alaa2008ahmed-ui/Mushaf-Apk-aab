name: Build Official Signed APK and AAB
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Build web project
        run: |
          chmod +x node_modules/.bin/vite || true
          npm run build
        
      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Fix Path Check
        run: echo "android.overridePathCheck=true" >> android/gradle.properties

      - name: Prepare Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_CONTENT }}" | base64 -d > release.keystore

      - name: Build Signed Release (APK and AAB Together)
        run: |
          cd android
          chmod +x gradlew
          # "clean" تضمن مسح أي ملفات قديمة لكي لا تختلط بالنسخ الجديدة
          ./gradlew clean assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Final Packages (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Mushaf-Final-Package
          # المسارات محددة لضمان جلب النسخ الـ Signed فقط (الموقعة)
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error